dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - package.json
          - package-lock.json
docs:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
          - README.md
litra:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - com.daczarne.litra.sdPlugin/**
              - rollup.config.mjs
              - scripts/check-ui.mjs
              - scripts/generate-icons.mjs
              - scripts/probes/**
          - all-globs-to-any-file:
              - src/**
              - "!src/**/*.test.ts"
              - "!src/test-support/**"
tests:
  - changed-files:
      - any-glob-to-any-file:
          - browser-tests/**
          - src/**/*.test.ts
          - src/test-support/**
          - vitest.browser.config.mjs
          - vitest.config.mjs
tools:
  - changed-files:
      - any-glob-to-any-file:
          - .cspell.json
          - .cspell/**
          - .editorconfig
          - .gitattributes
          - .gitignore
          - .markdownlint-cli2.yaml
          - .markdownlint.yaml
          - .vscode/**
          - biome.json
          - tsconfig.json
          - tsconfig.scripts.json
workflows:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
