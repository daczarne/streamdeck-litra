name: Unchecked lamp report
description: How the plugin works with a lamp it hasn't been checked on, such as a Beam LX or a Glow.
body:
  - type: markdown
    attributes:
      value: >-
        The plugin is checked on Litra Beams only. The Beam LX and the Glow take the same commands, so their front
        light should work, but nobody has checked. Whether it works or not, a report helps.
  - type: textarea
    id: lamps
    attributes:
      label: Lamps
      description: Every lamp connected while you tried it, the Beams too, with its model and what it's plugged into.
      placeholder: |
        One Litra Beam LX, plugged into the computer
        Two Litra Glows, one on a USB hub and one plugged into the computer
    validations:
      required: true
  - type: textarea
    id: actions
    attributes:
      label: What you tried
      description: Each action you used, on a key or a dial, and what each lamp did.
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: In Stream Deck's preferences, under Plugins.
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Stream Deck app version
      placeholder: "7.6"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: The system and its version.
      placeholder: macOS 15.5
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: >-
        Optional: the lines of `litra.log` from while you tried it. For an installed plugin, it's in
        `~/Library/Application Support/com.elgato.StreamDeck/Plugins/com.daczarne.litra.sdPlugin/logs/` on macOS, and
        in `%APPDATA%\Elgato\StreamDeck\Plugins\com.daczarne.litra.sdPlugin\logs\` on Windows. Replace your lamps'
        serial numbers with placeholders, such as `<serialNumber1>`, before posting.
      render: text
