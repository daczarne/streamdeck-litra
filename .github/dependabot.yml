version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      elgato:
        patterns:
          - "@elgato/*"
      rollup:
        patterns:
          - "rollup"
          - "@rollup/*"
      types:
        patterns:
          - "@types/*"
          - "@tsconfig/*"
    ignore:
      # @rollup/plugin-typescript does not support TypeScript 6+/7 yet
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Keep Node types aligned with the Node 24 minor that Stream Deck runs the plugin on
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
