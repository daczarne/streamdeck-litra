name: Main

on:
  pull_request:
    paths:
      - "**/**"
    types:
      - opened
      - reopened
      - synchronize
  # Not on tags: the only ones are the releases', which GitHub creates on a commit main already checked when a draft is
  # published. A run for one would repeat every check, skip the release job, and be what the commit shows.
  push:
    branches:
      - main

permissions: {}

jobs:
  label-pr:
    name: Label PR
    runs-on: ubuntu-24.04
    # A pull request from a fork gets a read-only token, with which labeling fails. It's skipped for those, which
    # alls-green allows, rather than run with pull_request_target, which would give a fork's code write access.
    if: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      pull-requests: write
    outputs:
      labels: ${{ steps.pr_labeler.outputs.all-labels }}
    steps:
      - name: PR labeler 🏷
        id: pr_labeler
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yaml
          sync-labels: true
          dot: true
      - name: Show labels 👀
        id: show_labels
        env:
          ALL_LABELS: ${{ steps.pr_labeler.outputs.all-labels }}
          NEW_LABELS: ${{ steps.pr_labeler.outputs.new-labels }}
        run: |
          echo "ALL_LABELS: ${{ env.ALL_LABELS }}"
          echo "NEW_LABELS: ${{ env.NEW_LABELS }}"

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout 🛎️
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Markdown files 🧪
        id: lint_markdown_files
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          config: .markdownlint.yaml
          globs: .

  spell-check:
    name: Spell check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout 🛎️
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run spell checking 🧪
        id: run_spell_checking
        uses: streetsidesoftware/cspell-action@6f3c77c1406bc930f944ba97e9801a22e42caf58 # v9.1.0
        with:
          root: .
          check_dot_files: true
          inline: error
          strict: true
          config: .cspell.json
          verbose: true
          incremental_files_only: false

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    needs:
      - lint
      - spell-check
    permissions:
      contents: read
    steps:
      - name: Checkout 🛎️
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 🟢
        id: setup_node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install dependencies 📦
        id: install_dependencies
        run: npm ci --ignore-scripts
      - name: Type check 🧪
        id: type_check
        run: npm run typecheck
      - name: Lint and format check 🧪
        id: lint_code
        run: npm run lint
      - name: Doc comments check 🧪
        id: check_docs
        run: npm run check:docs
      - name: Check the icons match their code 🧪
        id: check_icons
        # Regenerates the plugin's icons, and fails if that changes anything in imgs/: the committed files must be what
        # scripts/generate-icons.mjs draws from the pinned @daczarne/streamdeck-icons.
        run: |
          npm run icons
          git status --porcelain -- com.daczarne.litra.sdPlugin/imgs
          test -z "$(git status --porcelain -- com.daczarne.litra.sdPlugin/imgs)"
      - name: Test 🧪
        id: test
        run: npm test
      - name: Validate 🧪
        id: validate
        # Runs check:ui, the build and streamdeck validate.
        run: npm run validate

  browser-tests:
    name: Browser tests
    runs-on: ubuntu-24.04
    # The slowest checks, and independent of the tests job's: they load the settings pages from the plugin folder, which
    # needs no build, so they run beside it rather than after it.
    needs:
      - lint
      - spell-check
    permissions:
      contents: read
    steps:
      - name: Checkout 🛎️
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 🟢
        id: setup_node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install dependencies 📦
        id: install_dependencies
        run: npm ci --ignore-scripts
      - name: Browser tests 🧪
        id: browser_tests
        # Drives the Google Chrome that comes installed on the runner, at whatever version the runner image has.
        # If Chrome starts failing here with "No usable sandbox", the runner's Ubuntu is restricting the user
        # namespaces Chrome's sandbox needs. Adding --no-sandbox to the flags in browser-tests/support/chrome.ts,
        # for CI only, is acceptable: Chrome only ever loads the plugin's own local pages there.
        run: npm run test:browser

  alls-green:
    name: Ensure all checks have passed
    if: always()
    runs-on: ubuntu-24.04
    needs:
      - label-pr
      - lint
      - spell-check
      - tests
      - browser-tests
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: label-pr
          jobs: ${{ toJSON(needs) }}

  release:
    name: Draft a release
    # Runs on every push to main, once every check has passed, and drafts a release when the manifest's version has
    # none yet, so a merge that bumps the version is what makes a release. Publishing the draft stays manual.
    # The gate's result is checked by name: without a status function, the condition would get an implicit success(),
    # which looks at every job up the chain, and label-pr is always skipped on a push.
    if: >-
      ${{ !cancelled() && needs.alls-green.result == 'success'
      && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    needs:
      - alls-green
    # Two merges in a row run one after the other, so the second sees the first one's draft.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      # Lists the releases, drafts included, and creates the draft.
      contents: write
      # Signs the provenance attestation, and stores it.
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      PACKAGE: release/com.daczarne.litra.streamDeckPlugin
    steps:
      - name: Checkout 🛎️
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for a release of this version 🔎
        id: version
        # The manifest's Version has Elgato's four numbers, the last always 0, and the tag the first three. A draft has
        # no tag until it's published, so the check looks for a release with the tag's name, drafts included.
        run: |
          manifest_version=$(jq -r .Version com.daczarne.litra.sdPlugin/manifest.json)
          if [[ ! "$manifest_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.0$ ]]; then
            echo "::error::The manifest's Version, $manifest_version, isn't {major}.{minor}.{patch}.0"
            exit 1
          fi
          version="${manifest_version%.0}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          if grep -qxF "v$version" <<< "$tags"; then
            echo "v$version already has a release: nothing to draft."
            echo "draft=false" >> "$GITHUB_OUTPUT"
          else
            echo "draft=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node 🟢
        id: setup_node
        if: ${{ steps.version.outputs.draft == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install dependencies 📦
        id: install_dependencies
        if: ${{ steps.version.outputs.draft == 'true' }}
        run: npm ci --ignore-scripts
      - name: Pack 📦
        id: pack
        if: ${{ steps.version.outputs.draft == 'true' }}
        # Runs check:ui, the build and streamdeck pack.
        run: npm run pack
      - name: Attest the package's provenance 🔏
        id: attest
        if: ${{ steps.version.outputs.draft == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.PACKAGE }}
          # A storage record is only made for an image pushed to a registry, which the package isn't.
          create-storage-record: false
      - name: Draft the release 📝
        id: draft
        if: ${{ steps.version.outputs.draft == 'true' }}
        # The title is the H1 on the first line of .github/release-notes.md, and the notes are the rest of it, followed
        # by the pull requests merged since the last release, which GitHub lists.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sha256=$(sha256sum "$PACKAGE" | cut -d ' ' -f 1)
          title=$(head -n 1 .github/release-notes.md | sed -e 's/^# //' -e "s/@VERSION@/$VERSION/g")
          tail -n +2 .github/release-notes.md \
            | sed -e "s/@VERSION@/$VERSION/g" -e "s/@SHA256@/$sha256/g" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" "$PACKAGE" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "$title" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
