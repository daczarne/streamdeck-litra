<!DOCTYPE html>
<html>

  <head lang="en">
    <title>Litra Brightness</title>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'none';
        script-src 'self';
        style-src 'unsafe-inline';
        img-src data:;
        connect-src ws://localhost:*;
        base-uri 'none';
        form-action 'none'
      "
    />
    <script src="vendor/sdpi-components.js"></script>
    <script src="number-field.js"></script>
  </head>

  <body>
    <!-- The plugin's own settings, the same on every page, which plugin-settings.js shows in place of the action's
      (#146). -->
    <div id="plugin-settings"></div>
    <!-- Key tiles: snap to a fixed brightness. Dial tiles: step size and the lamp screens' blink. -->
    <div id="key-settings" hidden>
      <sdpi-item label="Brightness">
        <litra-number setting="presetPercentage" min="0" max="100" step="1" default="0" unit="%"></litra-number>
      </sdpi-item>
      <!-- The lamps the key acts on, which lamp-picker.js lists and saves (#20), and whether lamps added later
        join them, which plugin-settings.js shows and saves (#147). -->
      <sdpi-item label="Lamps">
        <div id="lamp-picker"></div>
        <div id="key-new-lamps"></div>
      </sdpi-item>
    </div>
    <div id="dial-settings" hidden>
      <sdpi-item label="Step">
        <litra-number setting="stepPercentage" min="1" max="25" step="1" default="10" unit="%"></litra-number>
      </sdpi-item>
      <!-- The dial's own blink of each lamp as its lamp screen shows it, which plugin-settings.js shows and saves to the
        plugin's global settings, beside every dial's (#144). -->
      <sdpi-item label="Lamp screens">
        <div id="dial-blink"></div>
      </sdpi-item>
    </div>
    <script src="controller-toggle.js"></script>
    <script src="lamp-picker.js"></script>
    <script src="plugin-settings.js"></script>
  </body>

</html>
