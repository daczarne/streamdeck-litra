<!DOCTYPE html>
<html>

  <head lang="en">
    <title>Litra Brightness</title>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'none';
        script-src 'self';
        style-src 'unsafe-inline';
        img-src data:;
        connect-src ws://localhost:*;
        base-uri 'none';
        form-action 'none'
      "
    />
    <script src="vendor/sdpi-components.js"></script>
    <style>
      /* A slider with its value on its right, shown by range-value.js. */
      .range {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .range sdpi-range {
        flex: 1;
      }

      .range output {
        min-width: 6ch;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>

  <body>
    <!-- Key tiles: snap to a fixed brightness. Dial tiles: step size, and the lamp screens' blink. -->
    <div id="key-settings" hidden>
      <sdpi-item label="Brightness">
        <div class="range">
          <sdpi-range
            id="preset-percentage"
            setting="presetPercentage"
            min="0"
            max="100"
            step="1"
            default="0"
          ></sdpi-range>
          <output for="preset-percentage" data-suffix="%"></output>
        </div>
      </sdpi-item>
      <!-- The lamps the key acts on, which lamp-picker.js lists and saves (#20). -->
      <sdpi-item label="Lamps">
        <div id="lamp-picker"></div>
      </sdpi-item>
    </div>
    <div id="dial-settings" hidden>
      <sdpi-item label="Step">
        <div class="range">
          <sdpi-range
            id="step-percentage"
            setting="stepPercentage"
            min="1"
            max="25"
            step="1"
            default="10"
          ></sdpi-range>
          <output for="step-percentage" data-suffix="%"></output>
        </div>
      </sdpi-item>
      <!-- Saved to the plugin's global settings, which every Brightness and Temperature dial shares (#144). -->
      <sdpi-item label="Lamp screens">
        <sdpi-checkbox
          setting="blinkOnLampScreen"
          global
          label="Blink each lamp as it's shown, on every dial"
        ></sdpi-checkbox>
      </sdpi-item>
    </div>
    <script src="controller-toggle.js"></script>
    <script src="range-value.js"></script>
    <script src="lamp-picker.js"></script>
  </body>

</html>
