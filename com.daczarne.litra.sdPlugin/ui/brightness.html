<!DOCTYPE html>
<html>
<head lang="en">
	<title>Litra Brightness</title>
	<meta charset="utf-8" />
	<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
	<!-- Key tiles: snap to a fixed brightness. Dial tiles: step size only. -->
	<div id="key-settings" hidden>
		<sdpi-item label="Brightness %">
			<sdpi-range setting="presetPercentage" min="0" max="100" step="1" default="100" showlabels></sdpi-range>
		</sdpi-item>
	</div>
	<div id="dial-settings" hidden>
		<sdpi-item label="Step %">
			<sdpi-range setting="stepPercentage" min="1" max="25" step="1" default="5" showlabels></sdpi-range>
		</sdpi-item>
	</div>
	<script>
		(async () => {
			const info = await SDPIComponents.streamDeckClient.getConnectionInfo();
			const controller = info?.actionInfo?.payload?.controller;
			const isDial = controller === "Encoder";
			document.getElementById("key-settings").hidden = isDial;
			document.getElementById("dial-settings").hidden = !isDial;
		})();
	</script>
</body>
</html>
