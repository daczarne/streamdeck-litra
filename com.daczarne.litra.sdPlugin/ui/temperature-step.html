<!DOCTYPE html>
<html>

  <head lang="en">
    <title>Litra Temperature Step</title>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'none';
        script-src 'self';
        style-src 'self' 'sha256-vKw8ls2elF9883OhOYVfGxLK/KT9XeS8Exwh3wy8CrM=';
        img-src data:;
        connect-src ws://localhost:*;
        base-uri 'none';
        form-action 'none'
      "
    />
    <link rel="stylesheet" href="settings.css" />
    <script src="vendor/sdpi-components.js"></script>
    <script src="number-field.js"></script>
  </head>

  <body>
    <!-- The plugin's own settings, the same on every page, which plugin-settings.js shows in place of the action's
      (#146). -->
    <div id="plugin-settings"></div>
    <!-- How far a press of a Temperature Up or Down key moves the lamps: the same steps as a Set Temperature
      dial's. -->
    <sdpi-item label="Step K">
      <litra-number setting="stepKelvin" min="100" max="500" step="100" default="300" unit="K"></litra-number>
    </sdpi-item>
    <!-- What the key's title shows, unless one is typed in Stream Deck's own title settings: what its lamps are at,
      where its next press takes them, or its step. -->
    <sdpi-item label="Title value">
      <sdpi-select setting="stepKeyTitle" default="current">
        <option value="current">Current</option>
        <option value="next">Next</option>
        <option value="step">Step</option>
      </sdpi-select>
    </sdpi-item>
    <!-- The lamps the key acts on, which lamp-picker.js lists and saves (#20), and whether lamps added later
      join them, which plugin-settings.js shows and saves (#147). -->
    <sdpi-item label="Lamps">
      <div id="lamp-picker"></div>
      <div id="key-new-lamps"></div>
    </sdpi-item>
    <!-- Whether the key turns its lamps on as it changes them, which plugin-settings.js shows and saves to the plugin's
      global settings, beside every key's of its kind (#268, #181). -->
    <sdpi-item label="Turn on">
      <div id="key-turn-on"></div>
    </sdpi-item>
    <script src="lamp-picker.js"></script>
    <script src="plugin-settings.js"></script>
  </body>

</html>
