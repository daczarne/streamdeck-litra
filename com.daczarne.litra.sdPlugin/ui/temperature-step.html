<!DOCTYPE html>
<html>

  <head lang="en">
    <title>Litra Temperature Step</title>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'none';
        script-src 'self';
        style-src 'unsafe-inline';
        img-src data:;
        connect-src ws://localhost:*;
        base-uri 'none';
        form-action 'none'
      "
    />
    <script src="vendor/sdpi-components.js"></script>
  </head>

  <body>
    <!-- The plugin's own settings, the same on every page, which plugin-settings.js shows in place of the action's
      (#146). -->
    <div id="plugin-settings"></div>
    <!-- How far a press of a Temperature Up or Down key moves the lamps: the same steps as a Temperature dial's. -->
    <sdpi-item label="Step K">
      <sdpi-select setting="stepKelvin" default="300">
        <option value="100">100</option>
        <option value="200">200</option>
        <option value="300">300</option>
        <option value="500">500</option>
      </sdpi-select>
    </sdpi-item>
    <!-- Saved to the plugin's global settings, which every Temperature dial and step key shares (#145). -->
    <sdpi-item label="Each lamp">
      <sdpi-checkbox
        setting="keepTemperatureDifference"
        global
        label="Steps from its own temperature, on every dial and key"
      ></sdpi-checkbox>
    </sdpi-item>
    <!-- The lamps the key acts on, which lamp-picker.js lists and saves (#20). -->
    <sdpi-item label="Lamps">
      <div id="lamp-picker"></div>
    </sdpi-item>
    <script src="lamp-picker.js"></script>
    <script src="plugin-settings.js"></script>
  </body>

</html>
