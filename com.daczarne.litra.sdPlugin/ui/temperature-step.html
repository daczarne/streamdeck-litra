<!DOCTYPE html>
<html>

  <head lang="en">
    <title>Litra Temperature Step</title>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'none';
        script-src 'self';
        style-src 'unsafe-inline';
        img-src data:;
        connect-src ws://localhost:*;
        base-uri 'none';
        form-action 'none'
      "
    />
    <script src="vendor/sdpi-components.js"></script>
  </head>

  <body>
    <!-- How far a press of a Temperature Up or Down key moves the lamps: the same steps as a Temperature dial's. -->
    <sdpi-item label="Step K">
      <sdpi-select setting="stepKelvin" default="300">
        <option value="100">100</option>
        <option value="200">200</option>
        <option value="300">300</option>
        <option value="500">500</option>
      </sdpi-select>
    </sdpi-item>
  </body>

</html>
