<!DOCTYPE html>
<html>

  <head lang="en">
    <title>Litra Scene</title>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'none';
        script-src 'self';
        style-src 'self' 'sha256-vKw8ls2elF9883OhOYVfGxLK/KT9XeS8Exwh3wy8CrM=';
        img-src data:;
        connect-src ws://localhost:*;
        base-uri 'none';
        form-action 'none'
      "
    />
    <link rel="stylesheet" href="settings.css" />
    <script src="vendor/sdpi-components.js"></script>
    <script src="number-field.js"></script>
    <script src="power-switch.js"></script>
  </head>

  <body>
    <!-- The plugin's own settings, the same on every page, which plugin-settings.js shows in place of the action's
      (#146). -->
    <div id="plugin-settings"></div>
    <!-- The scene's first group, the key's own settings (#174): whether it turns its lamps on or off, and the presets
      it turns them on at, the same as the Set Temperature and Set Brightness keys', on one row. While it turns them
      off, scene-groups.js greys out its presets, which then show a dash, and shows the note under the row's controls.
      Its heading always shows, so the page looks the same whether or not a group was added. -->
    <h2 id="first-group-heading" class="group-heading">Group 1</h2>
    <div class="scene-row">
      <span>Power</span>
      <span>Temperature</span>
      <span>Brightness</span>
      <litra-switch id="power" setting="power" default="on"></litra-switch>
      <litra-number
        class="first-group-preset"
        setting="presetKelvin"
        min="2700"
        max="6500"
        step="100"
        default="2700"
        unit="K"
      ></litra-number>
      <litra-number
        class="first-group-preset"
        setting="presetPercentage"
        min="0"
        max="100"
        step="1"
        default="0"
        unit="%"
      ></litra-number>
      <p id="first-group-off-note" class="off-note" hidden>
        Temperature and Brightness aren't applied while Power is off
      </p>
    </div>
    <!-- The lamps the key acts on, which lamp-picker.js lists and saves (#20), and whether lamps added later
      join them, which plugin-settings.js shows and saves (#147). -->
    <sdpi-item label="Lamps">
      <div id="lamp-picker"></div>
      <div id="key-new-lamps"></div>
    </sdpi-item>
    <!-- The groups added after the first, and the button that adds one, which scene-groups.js draws and saves. -->
    <div id="added-groups"></div>
    <script src="lamp-picker.js"></script>
    <script src="scene-groups.js"></script>
    <script src="plugin-settings.js"></script>
  </body>

</html>
