<!DOCTYPE html>
<html>

  <head lang="en">
    <title>Litra Temperature</title>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'none';
        script-src 'self';
        style-src 'self' 'sha256-vKw8ls2elF9883OhOYVfGxLK/KT9XeS8Exwh3wy8CrM=';
        img-src data:;
        connect-src ws://localhost:*;
        base-uri 'none';
        form-action 'none'
      "
    />
    <link rel="stylesheet" href="settings.css" />
    <script src="vendor/sdpi-components.js"></script>
    <script src="number-field.js"></script>
  </head>

  <body>
    <!-- The plugin's own settings, the same on every page, which plugin-settings.js shows in place of the action's
      (#146). -->
    <div id="plugin-settings"></div>
    <!-- How far a tick of the dial moves the lamps, and its own blink of each lamp as its lamp screen shows it, which
      plugin-settings.js shows and saves to the plugin's global settings, beside every dial's (#144). -->
    <sdpi-item label="Step K">
      <litra-number setting="stepKelvin" min="100" max="500" step="100" default="300" unit="K"></litra-number>
    </sdpi-item>
    <sdpi-item label="Lamp screens">
      <div id="dial-blink"></div>
    </sdpi-item>
    <script src="plugin-settings.js"></script>
  </body>

</html>
