<!DOCTYPE html>
<html>

  <head lang="en">
    <title>Litra Temperature</title>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'none';
        script-src 'self';
        style-src 'self' 'sha256-vKw8ls2elF9883OhOYVfGxLK/KT9XeS8Exwh3wy8CrM=';
        img-src data:;
        connect-src ws://localhost:*;
        base-uri 'none';
        form-action 'none'
      "
    />
    <link rel="stylesheet" href="settings.css" />
    <script src="vendor/sdpi-components.js"></script>
    <script src="number-field.js"></script>
  </head>

  <body>
    <!-- The plugin's own settings, the same on every page, which plugin-settings.js shows in place of the action's
      (#146). -->
    <div id="plugin-settings"></div>
    <!-- The title the dial's main screen shows, empty for the title the plugin settings give the action's dials, which
      plugin-settings.js shows in it, greyed out, as it holds it, with a × that empties it (title-field.js, #181),
      how far a tick of the dial moves the lamps, and, which plugin-settings.js shows and saves to the plugin's global
      settings, beside every dial's, whether a turn on its main screen turns the lamps on (#268, #181), its own blink of
      each lamp as its lamp screen shows it (#144), and whether a turn there turns the lamp on. -->
    <sdpi-item label="Title">
      <div class="text-and-clear">
        <sdpi-textfield
          setting="title"
          default=""
          maxlength="24"
          data-placeholder-from="temperatureDialTitle"
        ></sdpi-textfield>
        <button type="button" class="clear" title="Clear title" aria-label="Clear title">
          <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true">
            <path d="M2 2l6 6M8 2l-6 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </sdpi-item>
    <sdpi-item label="Step K">
      <litra-number setting="stepKelvin" min="100" max="500" step="100" default="300" unit="K"></litra-number>
    </sdpi-item>
    <sdpi-item label="Turn on">
      <div id="dial-turn-on"></div>
    </sdpi-item>
    <sdpi-item label="Lamp screens">
      <div id="dial-blink"></div>
    </sdpi-item>
    <sdpi-item>
      <div id="lamp-screen-turn-on"></div>
    </sdpi-item>
    <!-- The screen the dial starts on as it appears: its main screen, or a lamp's, which start-on.js lists and saves
      (#278). -->
    <sdpi-item label="Start on">
      <div id="start-on"></div>
    </sdpi-item>
    <script src="title-field.js"></script>
    <script src="start-on.js"></script>
    <script src="plugin-settings.js"></script>
  </body>

</html>
