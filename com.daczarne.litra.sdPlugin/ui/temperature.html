<!DOCTYPE html>
<html>
<head lang="en">
	<title>Litra Temperature</title>
	<meta charset="utf-8" />
	<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
	<!-- Key tiles: snap to a fixed Kelvin. Dial tiles: step size only. -->
	<div id="key-settings" hidden>
		<sdpi-item label="Temperature K">
			<sdpi-range setting="presetKelvin" min="2700" max="6500" step="100" default="4000" showlabels></sdpi-range>
		</sdpi-item>
	</div>
	<div id="dial-settings" hidden>
		<sdpi-item label="Step K">
			<sdpi-select setting="stepKelvin" default="100">
				<option value="100">100</option>
				<option value="200">200</option>
				<option value="300">300</option>
				<option value="500">500</option>
			</sdpi-select>
		</sdpi-item>
	</div>
	<script>
		(async () => {
			const info = await SDPIComponents.streamDeckClient.getConnectionInfo();
			const controller = info?.actionInfo?.payload?.controller;
			const isDial = controller === "Encoder";
			document.getElementById("key-settings").hidden = isDial;
			document.getElementById("dial-settings").hidden = !isDial;
		})();
	</script>
</body>
</html>
