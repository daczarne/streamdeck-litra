<!DOCTYPE html>
<html>

  <head lang="en">
    <title>Litra Temperature</title>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'none';
        script-src 'self';
        style-src 'unsafe-inline';
        img-src data:;
        connect-src ws://localhost:*;
        base-uri 'none';
        form-action 'none'
      "
    />
    <script src="vendor/sdpi-components.js"></script>
    <style>
      /* A slider with its value on its right, shown by range-value.js. */
      .range {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .range sdpi-range {
        flex: 1;
      }

      .range output {
        min-width: 6ch;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>

  <body>
    <!-- The plugin's own settings, the same on every page, which plugin-settings.js shows in place of the action's
      (#146). -->
    <div id="plugin-settings"></div>
    <!-- Key tiles: snap to a fixed Kelvin. Dial tiles: step size and the lamp screens' blink. -->
    <div id="key-settings" hidden>
      <sdpi-item label="Temperature">
        <div class="range">
          <sdpi-range
            id="preset-kelvin"
            setting="presetKelvin"
            min="2700"
            max="6500"
            step="100"
            default="2700"
          ></sdpi-range>
          <output for="preset-kelvin" data-suffix=" K"></output>
        </div>
      </sdpi-item>
      <!-- The lamps the key acts on, which lamp-picker.js lists and saves (#20). -->
      <sdpi-item label="Lamps">
        <div id="lamp-picker"></div>
      </sdpi-item>
    </div>
    <div id="dial-settings" hidden>
      <sdpi-item label="Step K">
        <sdpi-select setting="stepKelvin" default="300">
          <option value="100">100</option>
          <option value="200">200</option>
          <option value="300">300</option>
          <option value="500">500</option>
        </sdpi-select>
      </sdpi-item>
      <!-- Saved to the plugin's global settings, which every Brightness and Temperature dial shares (#144). -->
      <sdpi-item label="Lamp screens">
        <sdpi-checkbox
          setting="blinkOnLampScreen"
          global
          label="Blink each lamp as it's shown, on every dial"
        ></sdpi-checkbox>
      </sdpi-item>
    </div>
    <script src="controller-toggle.js"></script>
    <script src="range-value.js"></script>
    <script src="lamp-picker.js"></script>
    <script src="plugin-settings.js"></script>
  </body>

</html>
