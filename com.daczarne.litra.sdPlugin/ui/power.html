<!DOCTYPE html>
<html>

  <head lang="en">
    <title>Litra Power</title>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'none';
        script-src 'self';
        style-src 'unsafe-inline';
        img-src data:;
        connect-src ws://localhost:*;
        base-uri 'none';
        form-action 'none'
      "
    />
    <script src="vendor/sdpi-components.js"></script>
  </head>

  <body>
    <!-- The plugin's own settings, the same on every page, which plugin-settings.js shows in place of the action's
      (#146). -->
    <div id="plugin-settings"></div>
    <sdpi-item label="Mode">
      <sdpi-select setting="mode" default="toggle">
        <option value="toggle">Toggle</option>
        <option value="on">On</option>
        <option value="off">Off</option>
      </sdpi-select>
    </sdpi-item>
    <!-- The lamps the key acts on, which lamp-picker.js lists and saves (#20). -->
    <sdpi-item label="Lamps">
      <div id="lamp-picker"></div>
    </sdpi-item>
    <script src="lamp-picker.js"></script>
    <script src="plugin-settings.js"></script>
  </body>

</html>
